name: Kustomize Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ vars.APP_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Render dev overlay
        run: envsubst < overlays/dev/kustomization.yaml.tmpl > overlays/dev/kustomization.yaml

      - name: Render prod overlay
        run: envsubst < overlays/prod/kustomization.yaml.tmpl > overlays/prod/kustomization.yaml

      - name: Build dev
        run: kustomize build overlays/dev

      - name: Build prod
        run: kustomize build overlays/prod
